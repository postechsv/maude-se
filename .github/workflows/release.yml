name: Release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    name: Build and test distributions
    uses: ./.github/workflows/build.yml

  publish-to-pypi:
    name: Publish Python distributions to PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, 'pre')
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: pypi
      url: https://pypi.org/p/maude-se

    permissions:
      id-token: write

    steps:
    - name: Download wheel distributions
      uses: actions/download-artifact@v4
      with:
        pattern: py-package-dist-*
        merge-multiple: true
        path: out/
    - name: Publish distributions to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        packages-dir: out/

  github-release:
    name: Sign distributions and create GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write
      id-token: write

    steps:
    - name: Download all distributions
      uses: actions/download-artifact@v4
      with:
        pattern: '*-dist-*'
        merge-multiple: true
        path: out/

    - name: Sign wheel distributions with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: ./out/*.whl

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        '${{ github.ref_name }}'
        --repo '${{ github.repository }}'
        --notes ""

    - name: Upload wheels and standalone ZIPs
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release upload
        '${{ github.ref_name }}' out/*.whl out/*.zip
        --repo '${{ github.repository }}'
