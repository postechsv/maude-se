name: Build and test
on:
  workflow_dispatch:
    inputs:
      linux_standalone_only:
        description: Recheck only the Linux standalone build
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read

jobs:
  verify-version:
    name: Verify package version
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Match release tag to package version
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        REF_TYPE: ${{ github.ref_type }}
      run: |
        top_dir="$PWD"
        source build/version.sh
        if [[ "$REF_TYPE" == tag ]]; then
          validate_maude_se_release_tag "$RELEASE_TAG"
        else
          maude_se_version >/dev/null
        fi

  manylinux_2_28:
    name: Linux wheels (manylinux_2_28)
    if: ${{ !inputs.linux_standalone_only }}
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
    - uses: actions/checkout@v4
    - name: Build and test Linux wheels
      run: |
        docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux_2_28_x86_64 \
          bash -c './build/many_linux.sh && bash ./build/test-linux.sh wheel'
    - name: Store wheel distributions
      uses: actions/upload-artifact@v4
      with:
        name: py-package-dist-many-linux
        path: out/

  macos_deps:
    name: Prepare macOS dependencies
    if: ${{ !inputs.linux_standalone_only }}
    strategy:
      matrix:
        os: ['macos-latest','macos-15-intel']
    runs-on: ${{ matrix.os }}
    needs: verify-version
    steps:
    - uses: actions/checkout@v4
    - name: Build shared wheel and standalone dependencies
      run: bash ./build/ci-macos-deps.sh prepare
    - name: Store macOS dependencies
      uses: actions/upload-artifact@v4
      with:
        name: macos-deps-${{ matrix.os }}
        path: .ci-deps/macos-deps.tar.gz
        if-no-files-found: error
        include-hidden-files: true

  macos:
    name: macOS wheel
    if: ${{ !inputs.linux_standalone_only }}
    strategy:
      matrix:
        os: ['macos-latest','macos-15-intel']
        python-version: ['3.10','3.11','3.12','3.13','3.14']
    runs-on: ${{ matrix.os }}
    needs: macos_deps
    steps:
    - uses: actions/checkout@v4
    - name: Download shared macOS dependencies
      uses: actions/download-artifact@v4
      with:
        name: macos-deps-${{ matrix.os }}
        path: .ci-deps/
    - name: Restore shared macOS dependencies
      run: bash ./build/ci-macos-deps.sh restore
    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install pypa/build
      run: python3 -m pip install build --user
    - name: Build Python wheel
      run: ./build/macos.sh
    - name: Test Z3, Yices, and cvc5
      run: ./build.sh test-wheel
    - name: Test Python regressions
      run: |
        python_tag="$(python3 -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')"
        test_python=".build-wheel/${python_tag}-$(uname -m)/venv-test/bin/python"
        "$test_python" -m unittest discover -s tests/regression/python -p 'test_*.py'
        for solver in z3 yices cvc5; do
          "$test_python" tests/regression/python/test_backend_lifetime.py "$solver"
          "$test_python" tests/regression/python/test_gc_lifetime.py "$solver"
          "$test_python" tests/regression/python/test_python_meta_search.py "$solver"
          "$test_python" tests/regression/python/test_folding_subsumption.py "$solver"
        done
        "$test_python" tests/regression/python/test_custom_connector_interface.py
        "$test_python" tests/regression/python/test_managed_z3_converter.py
        for solver in yices cvc5; do
          "$test_python" tests/regression/python/test_managed_other_converters.py "$solver"
        done
    - name: Test native installer from built wheel
      run: |
        python_tag="$(python3 -c 'import sys; print(f"cp{sys.version_info.major}{sys.version_info.minor}")')"
        test_python=".build-wheel/${python_tag}-$(uname -m)/venv-test/bin/python"
        test_installer=".build-wheel/${python_tag}-$(uname -m)/venv-test/bin/maude-se-installer"
        "$test_installer" install native z3 --source-dir "$PWD"
        "$test_installer" doctor native z3
        "$test_python" tests/regression/python/test_native_plugin_only.py z3
        "$test_python" tests/regression/python/test_native_backends.py z3
    - name: Store wheel distribution
      uses: actions/upload-artifact@v4
      with:
        name: py-package-dist-${{ strategy.job-index }}
        path: out/

  manylinux_native:
    name: Linux standalone (manylinux_2_34)
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
    - uses: actions/checkout@v4
    - name: Build MaudeSE
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        docker run --rm \
          -v "$PWD:/work" -w /work \
          -e GITHUB_TOKEN="${{ github.token }}" \
          quay.io/pypa/manylinux_2_34_x86_64 \
          bash -c "./build/native.sh build \"$TAG\""
    - name: Test standalone executable
      run: |
        docker run --rm -v "$PWD:/work" -w /work quay.io/pypa/manylinux_2_34_x86_64 \
          bash ./build/test-linux.sh standalone
    - name: Build and test cvc5 standalone
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        docker run --rm -v "$PWD:/work" -w /work \
          -e GITHUB_TOKEN="${{ github.token }}" -e TAG="$TAG" \
          quay.io/pypa/manylinux_2_34_x86_64 \
          bash -c 'top_dir=/work; source build/version.sh; release_tag="${TAG:-$(maude_se_release_tag)}"; ./build/native.sh set-env && ./build/native.sh deps cvc5 && ./build/native.sh build-maude-se "$release_tag" cvc5 && bash ./build/test-linux.sh standalone cvc5'
    - name: Build and test Yices standalone
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        docker run --rm -v "$PWD:/work" -w /work \
          -e GITHUB_TOKEN="${{ github.token }}" -e TAG="$TAG" \
          quay.io/pypa/manylinux_2_34_x86_64 \
          bash -c 'top_dir=/work; source build/version.sh; release_tag="${TAG:-$(maude_se_release_tag)}"; ./build/native.sh set-env && ./build/native.sh deps yices && ./build/native.sh build-maude-se "$release_tag" yices && bash ./build/test-linux.sh standalone yices'
    - name: Store standalone distribution
      uses: actions/upload-artifact@v4
      with:
        name: native-dist-many-linux
        path: out/

  macos_native:
    name: macOS standalone
    if: ${{ !inputs.linux_standalone_only }}
    strategy:
      matrix:
        os: ['macos-latest','macos-15-intel']
    runs-on: ${{ matrix.os }}
    needs: macos_deps
    steps:
    - uses: actions/checkout@v4
    - name: Download shared macOS dependencies
      uses: actions/download-artifact@v4
      with:
        name: macos-deps-${{ matrix.os }}
        path: .ci-deps/
    - name: Restore shared macOS dependencies
      run: bash ./build/ci-macos-deps.sh restore
    - name: Build MaudeSE
      env:
        TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
      run: |
        export GITHUB_TOKEN="${{ github.token }}"
        ./build/native.sh build "$TAG"
    - name: Test standalone executable
      run: ./build.sh test-standalone
    - name: Build and test cvc5 standalone
      run: |
        ./build.sh standalone cvc5
        ./build.sh test-standalone cvc5
    - name: Build and test Yices standalone
      run: |
        ./build.sh standalone yices
        ./build.sh test-standalone yices
    - name: Store standalone distribution
      uses: actions/upload-artifact@v4
      with:
        name: native-dist-${{ strategy.job-index }}
        path: out/
